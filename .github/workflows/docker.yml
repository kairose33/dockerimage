name: Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Dockerfile
        run: |
          pwd
          ls -la
          find . -name Dockerfile

      - name: Build Docker Image
        run: docker build -t my-app:${GITHUB_SHA} 
