name: Docker Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: ls -la

      - name: Build Docker Image
        run: docker build -t my-app:${GITHUB_SHA} 
